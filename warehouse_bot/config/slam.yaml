slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_filtered
    resolution: 0.05
    max_laser_range: 8.0             # A1 is noisy beyond ~8 m
    minimum_travel_distance: 0.15    # add a scan every 15 cm ...
    minimum_travel_heading: 0.15     # ... or every ~9 deg of turning
    map_update_interval: 2.0
    transform_publish_period: 0.05
    do_loop_closing: true
    throttle_scans: 1
