[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-warehouse-backend"
version = "0.1.0"
description = "Order and inventory API foundation for the MARS warehouse rover"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pymongo>=4.6,<5", "qrcode[pil]>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mars_warehouse_backend = ["web/*", "web/admin/*", "web/cart/*", "web/operator/*"]
